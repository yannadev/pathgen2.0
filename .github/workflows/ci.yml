name: CI

on:
  push:
  pull_request:

jobs:
  empty-project:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-a-production-secret
      DEBUG: "False"
      ALLOWED_HOSTS: example.invalid
      CSRF_TRUSTED_ORIGINS: https://example.invalid
      DATABASE_URL: postgresql://pathgen:pathgen@localhost:5432/pathgen_ci
      GROQ_API_KEY: ci-placeholder
      GROQ_MODEL: gpt-oss-120b
      OPENAI_API_KEY: ci-placeholder
      EMBEDDING_MODEL: text-embedding-3-small
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements.lock
      - run: npm ci
      - run: python manage.py check --settings=config.settings.local
      - run: python manage.py check --settings=config.settings.test
      - run: python manage.py check --deploy --settings=config.settings.production
      - run: npm run check
      - run: pytest
      - run: python manage.py collectstatic --noinput --settings=config.settings.production

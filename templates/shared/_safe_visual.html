<figure class="mt-4 rounded-[var(--radius-md)] bg-[var(--color-secondary)] p-4" role="img" aria-label="{{ alt_text }}">
  <div class="flex items-center gap-3 text-sm font-medium">
    <i data-lucide="shapes" aria-hidden="true" class="size-5 shrink-0 text-[var(--color-info-fg)]"></i>
    <span>{{ alt_text }}</span>
  </div>
  <figcaption class="mt-2 text-xs text-[var(--color-foreground-muted)]">Interactive-safe figure preview · {{ component_label }}</figcaption>
</figure>

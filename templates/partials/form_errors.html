{% if form.errors %}
  <div id="{{ summary_id|default:'form-error-summary' }}" class="mb-5 rounded-lg bg-[var(--color-error-bg)] p-4 text-sm text-[var(--color-error-fg)]" role="alert" tabindex="-1" data-error-summary>
    <p class="font-semibold">Check the following before continuing:</p>
    <ul class="mt-2 list-disc space-y-1 pl-5">
      {% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}
      {% for field in form %}{% for error in field.errors %}<li><a href="#{{ field.id_for_label }}" class="underline underline-offset-2">{{ field.label }}: {{ error }}</a></li>{% endfor %}{% endfor %}
    </ul>
  </div>
{% endif %}

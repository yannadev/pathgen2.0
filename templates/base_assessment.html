{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="only light">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Assessment · PathGen{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'dist/app.css' %}">
  </head>
  <body class="min-h-screen bg-[var(--color-background)] text-[var(--color-foreground)] antialiased">
    <a href="#main-content" class="sr-only z-50 rounded-md bg-[var(--color-surface)] px-4 py-3 text-[var(--color-info-fg)] focus:not-sr-only focus:fixed focus:left-4 focus:top-4">Skip to assessment</a>
    <header class="border-b border-[var(--color-border)] bg-[var(--color-surface)]">
      <div class="mx-auto flex min-h-16 w-full max-w-5xl items-center justify-between gap-4 px-4 sm:px-6">
        <a href="{% url 'learning:my_lesson' %}" class="inline-flex min-h-11 items-center gap-2 font-semibold"><img src="{% static 'images/brand/pathgen-mark.webp' %}" alt="" class="size-8 object-contain"><span>PathGen</span></a>
        {% block assessment_header %}{% endblock %}
      </div>
    </header>
    <main id="main-content" class="mx-auto w-full max-w-5xl px-4 py-7 sm:px-6 sm:py-10">
      {% include "partials/messages.html" %}
      {% block content %}{% endblock %}
    </main>
    {% block dialogs %}{% endblock %}
    <script src="{% static 'dist/app.js' %}" defer></script>
  </body>
</html>

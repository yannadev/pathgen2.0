{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="only light">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PathGen{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'dist/app.css' %}">
  </head>
  <body class="min-h-screen bg-[var(--color-background)] text-[var(--color-foreground)] antialiased selection:bg-[var(--color-primary-subtle)] selection:text-[var(--color-foreground)]">
    <a href="#main-content" class="sr-only z-50 rounded-md bg-[var(--color-surface)] px-4 py-3 text-[var(--color-info-fg)] focus:not-sr-only focus:fixed focus:left-4 focus:top-4">
      Skip to main content
    </a>
    <main id="main-content" class="mx-auto flex min-h-screen w-full max-w-6xl items-center px-4 py-10 sm:px-8 lg:px-12">
      {% block content %}{% endblock %}
    </main>
    <script src="{% static 'dist/app.js' %}" defer></script>
  </body>
</html>
